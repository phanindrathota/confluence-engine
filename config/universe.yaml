# Universe and cadences for Phase 0 collection.
# Times are US/Central. All cadences are in seconds.

indices: [SPX, SPY, QQQ, IWM]
stocks: [NVDA, AAPL, TSLA, META, AMZN, GOOGL, MSFT, COIN, MSTR, MU, SNDK,
         HOOD, ARM, CRWD, ORCL, QCOM, MRVL, MRNA, SPCX]

session:
  timezone: America/Chicago
  collect_start: "08:25"   # a few minutes before the open
  collect_end: "15:20"     # covers SPX's 15:15 close
  regular_open: "08:30"
  regular_close: "15:00"

live:
  order_flow:
    cadence_s: 20
    # Collection floor, deliberately below the alert thresholds
    # (index 0DTE $250K, stock 0DTE $150K, 7-14 DTE $250K, 90 DTE $500K)
    # so thresholds can be tuned later without re-collecting.
    min_premium: 50000
    max_pages_per_cycle: 10
  net_drift:
    cadence_s: 60
    aggregation: 1m
  stock_bars:
    cadence_s: 60
    aggregation: 1m
  exposure_fast:            # GEX and DEX snapshots by strike
    cadence_s: 180
    greeks: [GAMMA, DELTA]
    representation: PER_ONE_PERCENT_MOVE
  exposure_slow:            # charm and vanna move more slowly
    cadence_s: 600
    greeks: [CHARM, VANNA]
    representation: PER_ONE_PERCENT_MOVE
  dark_flow:
    cadence_s: 300
    aggregation: 5m
  vol_drift:
    cadence_s: 300
  news:
    cadence_s: 120

backfill:
  # Same datasets as live, pulled per session after the fact.
  interval_map_aggregation: 5m
  interval_map_greeks: [GAMMA, DELTA, CHARM, VANNA]
  min_premium: 50000
  max_flow_pages_per_ticker_day: 60
  # Backfill yields to the live collector during market hours unless --force.
  pause_during_session: true

